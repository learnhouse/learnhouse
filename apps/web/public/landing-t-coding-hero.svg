<text x="100" y="25" font-family="monospace" font-size="12" fill="#8a8a85">habits.py</text>
<g font-family="monospace" font-size="15">
<text x="28" y="82" fill="#6d6d68">1</text><text x="58" y="82"><tspan fill="#b49cff">def</tspan><tspan fill="#ffb224"> streak</tspan><tspan fill="#eaeae5">(days):</tspan></text>
<text x="28" y="110" fill="#6d6d68">2</text><text x="90" y="110" fill="#8a8a85"># longest run of done days</text>
<text x="28" y="138" fill="#6d6d68">3</text><text x="90" y="138"><tspan fill="#eaeae5">best = run = </tspan><tspan fill="#7fd1a0">0</tspan></text>
<text x="28" y="166" fill="#6d6d68">4</text><text x="90" y="166"><tspan fill="#b49cff">for</tspan><tspan fill="#eaeae5"> done </tspan><tspan fill="#b49cff">in</tspan><tspan fill="#eaeae5"> days:</tspan></text>
<text x="28" y="194" fill="#6d6d68">5</text><text x="122" y="194"><tspan fill="#eaeae5">run = run + </tspan><tspan fill="#7fd1a0">1</tspan><tspan fill="#b49cff"> if</tspan><tspan fill="#eaeae5"> done </tspan><tspan fill="#b49cff">else</tspan><tspan fill="#7fd1a0"> 0</tspan></text>
<text x="28" y="222" fill="#6d6d68">6</text><text x="122" y="222"><tspan fill="#eaeae5">best = </tspan><tspan fill="#ffb224">max</tspan><tspan fill="#eaeae5">(best, run)</tspan></text>
<text x="28" y="250" fill="#6d6d68">7</text><text x="90" y="250"><tspan fill="#b49cff">return</tspan><tspan fill="#eaeae5"> best</tspan></text>
</g>
