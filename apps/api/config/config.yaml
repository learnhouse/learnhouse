site_name: Acyberschool
site_description: Learning should change what you are capable of applying at work, from day 1.
contact_email: acyberschool@gmail.com

# This config is optimized for local development. Production values should be supplied by environment variables.

general:
  # SECURITY: default to production-safe; enable with LEARNHOUSE_DEVELOPMENT_MODE=true for local dev.
  development_mode: false

security:
  # SECURITY: Set via LEARNHOUSE_AUTH_JWT_SECRET_KEY env var (required, min 32 chars).
  auth_jwt_secret_key: ""

hosting_config:
  tenancy: single
  domain: localhost:3000
  frontend_domain: localhost:3000
  ssl: false
  port: 1338
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
  cookies_config:
    domain: ".localhost"
  allowed_regexp: '\b((?:https?://)[^\s/$.?#].[^\s]*)\b'
  content_delivery:
    type: "filesystem"
    s3api:
      bucket_name: ""
      endpoint_url: ""

mailing_config:
  email_provider: "resend"
  system_email_address: ""
  resend_api_key: ""
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  smtp_use_tls: true

database_config:
  sql_connection_string: postgresql://learnhouse:learnhouse@localhost:5432/learnhouse

redis_config:
  redis_connection_string: redis://localhost:6379/learnhouse

payments_config:
  stripe:
    stripe_secret_key: ""
    stripe_publishable_key: ""
    stripe_client_id: ""
    stripe_webhook_standard_secret: ""
    stripe_webhook_connect_secret: ""

ai_config:
  # Acyberschool uses the provider-neutral LearnHouse AI layer with OpenAI by default.
  # Keep the secret outside GitHub and provide it at runtime via LEARNHOUSE_AI_API_KEY.
  is_ai_enabled: true
  provider: "openai"
  api_key: ""
  base_url: ""
  # Blank model fields use provider-aware defaults from src/services/ai/llm/tiers.py.
  model_fast: ""
  model_standard: ""
  model_pro: ""
  embedding_provider: ""
  embedding_model: ""
  embedding_dimensions: ""
  gemini_api_key: ""
  image_model: ""
  tts_model: ""

tinybird_config:
  api_url: ""
  ingest_token: ""
  read_token: ""