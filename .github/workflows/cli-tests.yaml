name: CLI Tests

permissions:
  contents: read

on:
  push:
    paths:
      - 'apps/cli/**'
      - '.github/workflows/cli-tests.yaml'
  pull_request:
    paths:
      - 'apps/cli/**'
      - '.github/workflows/cli-tests.yaml'

# The integration job boots real Docker and is allowed 45 minutes, so a
# superseded run is worth cancelling the moment a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/cli

jobs:
  # The unit suite needs no Docker daemon (a fake docker stands in), so it runs
  # on every OS the CLI supports and on each supported Node line.
  unit:
    name: "Unit Tests (${{ matrix.os }}, Node ${{ matrix.node }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      # setup-bun restores the toolchain, not the packages.
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cli-${{ runner.os }}-${{ hashFiles('apps/cli/bun.lock') }}
          restore-keys: bun-cli-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  # install.sh (macOS/Linux) and install.ps1 (Windows) against mocked commands.
  # The bash tests are part of the unit suite above; this job adds shellcheck
  # and the Pester suite, run with PowerShell on all three OSes.
  installers:
    name: "Installer scripts (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1

      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck -S warning install.sh

      - name: Pester (install.ps1)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/install.ps1.Tests.ps1'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  integration:
    name: Integration Tests (live install + upgrade, real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      # setup-bun restores the toolchain, not the packages.
      - name: Cache bun install cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-cli-${{ runner.os }}-${{ hashFiles('apps/cli/bun.lock') }}
          restore-keys: bun-cli-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run integration tests
        run: bun run test:integration
