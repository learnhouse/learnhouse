name: API Lint
on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"
permissions:
  contents: read

# Only the newest commit on a PR needs a result. Runs on dev are never
# cancelled; those are the ones whose result we keep.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Ruff lint
        # Pinned so lint stays deterministic and matched to the project config.
        run: pipx run ruff==0.15.9 check --output-format=github ./apps/api
