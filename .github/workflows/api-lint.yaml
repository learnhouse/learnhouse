name: API Lint
on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"
permissions:
  contents: read

# Only the newest commit on a PR needs a result. Runs on dev are never
# cancelled — those are the ones whose result we keep.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Ruff lint
        uses: chartboost/ruff-action@v1
        with:
          src: "./apps/api"
          # Pin the ruff version. Without it the action's auto-detection can
          # resolve to an empty version and fall back to a default rule set that
          # floods the whole tree with thousands of unrelated findings. Pinning
          # keeps lint deterministic and matched to the project config.
          version: "0.15.9"
