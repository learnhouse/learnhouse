name: Release

on:
  push:
    tags:
      - '[0-9]*'

# Nothing here writes to the repository (the GitHub Release is created by
# the release script); packages: write is for the GHCR push.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: learnhouse/app

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare platform pair
        id: prep
        run: |
          echo "platform_pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            LEARNHOUSE_PUBLIC=true
          cache-from: type=gha,scope=release-${{ steps.prep.outputs.platform_pair }}
          cache-to: type=gha,mode=max,scope=release-${{ steps.prep.outputs.platform_pair }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ steps.prep.outputs.platform_pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create release and push manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate image tags
        id: meta
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"
          TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          TAGS=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | xargs -I{} echo "-t {}" | tr '\n' ' ')
          docker buildx imagetools create $TAGS \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # GitHub Release is created by the release script (authored by you, not the bot)

  notify:
    name: Announce release
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Build Discord message
        # Commit subjects are untrusted text: keep them out of the script body
        # and let jq do all JSON encoding.
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PREV_TAG=$(git tag --list '[0-9]*' --sort=-v:refname | grep -vxF "$VERSION" | head -n1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          # Collect top features (max 5)
          FEATURES=$(git log "$RANGE" --grep="^feat" --pretty=format:"%s" | head -5 | sed 's/^feat[:(]*//' | sed 's/^[[:space:]]*//' | while read -r line; do echo "• ${line}"; done || true)
          FEAT_COUNT=$(git log "$RANGE" --grep="^feat" --oneline | wc -l | tr -d ' ')
          FIX_COUNT=$(git log "$RANGE" --grep="^fix" --oneline | wc -l | tr -d ' ')

          # Check for migrations
          if [ -n "$PREV_TAG" ]; then
            MIGRATION_COUNT=$(git diff --name-only "$PREV_TAG"..HEAD -- 'apps/api/migrations/versions/*.py' | grep -v '__pycache__' | wc -l | tr -d ' ')
          else
            MIGRATION_COUNT=$(git ls-tree -r --name-only HEAD -- 'apps/api/migrations/versions/' | grep '\.py$' | wc -l | tr -d ' ')
          fi

          NL=$'\n'

          # Build highlights
          HIGHLIGHTS=""
          if [ -n "$FEATURES" ]; then
            HIGHLIGHTS="${FEATURES}"
            if [ "$FEAT_COUNT" -gt 5 ]; then
              HIGHLIGHTS="${HIGHLIGHTS}${NL}• ...and $((FEAT_COUNT - 5)) more"
            fi
          fi

          # Build the embed description
          DESC="A new version of LearnHouse is available with **${FEAT_COUNT}** new feature(s) and **${FIX_COUNT}** bug fix(es)."
          if [ -n "$HIGHLIGHTS" ]; then
            DESC="${DESC}${NL}${NL}**Highlights:**${NL}${HIGHLIGHTS}"
          fi
          if [ "$MIGRATION_COUNT" -gt 0 ]; then
            DESC="${DESC}${NL}${NL}⚠️ Includes ${MIGRATION_COUNT} database migration(s). Back up before upgrading"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/${REPOSITORY}/releases/tag/${VERSION}" \
            --arg desc "$DESC" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              embeds: [{
                title: ("LearnHouse " + $version),
                url: $url,
                description: $desc,
                color: 3066993,
                fields: [
                  {name: "Install", value: "`npx learnhouse setup`", inline: true},
                  {name: "Upgrade", value: ("`npx learnhouse update --version " + $version + "`"), inline: true},
                  {name: "Docker", value: ("`docker pull ghcr.io/learnhouse/app:" + $version + "`"), inline: false}
                ],
                thumbnail: {url: "https://github.com/learnhouse.png"},
                footer: {text: "LearnHouse • Open Source LMS"},
                timestamp: $ts
              }]
            }' > "$RUNNER_TEMP/discord.json"

      - name: Send to Discord
        if: ${{ env.DISCORD_WEBHOOK_URL != '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -sf -H "Content-Type: application/json" \
            -d @"$RUNNER_TEMP/discord.json" \
            "$DISCORD_WEBHOOK_URL"
