name: API Tests
permissions:
  contents: read
on:
  push:
    branches:
      - dev
    paths:
      - "apps/api/**"
  pull_request:
    paths:
      - "apps/api/**"

# See api-lint.yaml: one live run per PR, dev runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          # Resolving and downloading the API's wheels from scratch on every
          # run is pure repetition; the lockfile is what decides the answer,
          # so key the cache on it.
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Cache ffmpeg packages
        # ffmpeg pulls ~60 MB of packages, and the Ubuntu mirror is sometimes
        # slow enough to make this the longest step. apt still resolves the
        # versions; it only skips downloading the ones already cached.
        uses: actions/cache@v6.1.0
        with:
          path: ~/apt-archives
          key: apt-ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install ffmpeg
        # Required by the video faststart / HLS transcode tests (they skip
        # without it, which would leave that code uncovered).
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

      - name: Install dependencies
        run: uv sync
        working-directory: apps/api

      - name: Run tests with coverage
        # One worker per core; worksteal rebalances when a worker lands the
        # slow files. -q because -v printed ~10k lines nobody read. The
        # coverage floor (100%) lives in pyproject.toml so local runs enforce
        # the same number. --durations keeps new slow tests visible.
        run: >-
          uv run pytest src/tests/ -n auto --dist worksteal -q --tb=short
          --durations=25
          --cov=src --cov-report=html --cov-report=term-missing:skip-covered
          --cov-report=xml:coverage.xml
        working-directory: apps/api
        env:
          TESTING: "true"

      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: apps/api/coverage.xml
          flags: api
          name: api-coverage
          fail_ci_if_error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: api-coverage-report
          path: apps/api/htmlcov/
          retention-days: 30
